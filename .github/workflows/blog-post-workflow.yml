name: Featured blog posts

on:
  schedule:
    - cron: "0 6 */14 * *"   # every 2 weeks at 06:00 UTC
  workflow_dispatch:         # to launch on demand if needed

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://bermu.dev/featured.xml"
          max_post_count: 3
          template: "- **[$title]($url)** · $date<br><sub>$description</sub>$newline"
          tag_post_pre_newline: true
          date_format: "mmm d, yyyy"
